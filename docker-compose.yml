version: '3.8'

services:
  stage-1:
    build: 
      context: ./stage-1-lithic
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      # Securely inject credentials from the host .env file
      - LITHIC_API_KEY=${LITHIC_API_KEY}
      - LITHIC_WEBHOOK_SECRET=${LITHIC_WEBHOOK_SECRET}
      - LITHIC_BASE_URL=${LITHIC_BASE_URL}
      - DATABASE_PATH=/app/data/state.db
      - TOXIPROXY_URL=http://toxiproxy:8474
    volumes:
      # Persist state manager database across container restarts
      - ./stage-1-lithic/data:/app/data
    depends_on:
      - toxiproxy
    networks:
      - x402-migration-network

  stage-2:
    build: 
      context: ./stage-2-hybrid
      dockerfile: Dockerfile
    ports:
      - "3002:3001"
    environment:
      - LITHIC_API_KEY=${LITHIC_API_KEY}
      - LITHIC_WEBHOOK_SECRET=${LITHIC_WEBHOOK_SECRET}
      - LITHIC_BASE_URL=${LITHIC_BASE_URL}
      - DATABASE_PATH=/app/data/state.db
      - TOXIPROXY_URL=http://toxiproxy:8474
    volumes:
      - ./stage-2-hybrid/data:/app/data
    depends_on:
      - toxiproxy
    networks:
      - x402-migration-network

  # Network resilience testing infrastructure
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.5.0
    ports:
      - "8474:8474"   # Toxiproxy Management API
      - "21000:21000" # Proxy port for Lithic API simulation
    networks:
      - x402-migration-network

networks:
  x402-migration-network:
    driver: bridge
